name: Construire l'APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: npm i -g @bubblewrap/cli
      - name: Configurer Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json
      - name: Clé de signature
        id: cle
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ]; then
            echo "$KS" | base64 -d > signing.keystore; echo "PASS=$PW" >> $GITHUB_ENV; echo "neuve=0" >> $GITHUB_OUTPUT
          else
            P=$(openssl rand -hex 12)
            keytool -genkeypair -v -keystore signing.keystore -alias oda -keyalg RSA -keysize 2048 -validity 10000 -storepass "$P" -keypass "$P" -dname "CN=ODA SHOP, O=ODA SHOP, C=NE"
            echo "PASS=$P" >> $GITHUB_ENV; echo "neuve=1" >> $GITHUB_OUTPUT
            mkdir cle && cp signing.keystore cle/ && echo "$P" > cle/mot-de-passe.txt && base64 -w0 signing.keystore > cle/keystore-base64.txt
          fi
      - name: Vérifier les fichiers
        run: |
          ls -la
          test -f twa-manifest.json || (echo "ERREUR : twa-manifest.json manque à la racine du dépôt" && exit 1)
      - name: Construire
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.PASS }}
        run: |
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json < /dev/null
          bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json < /dev/null
          ls -la *.apk
          cp app-release-signed.apk oda-shop.apk
      - name: Empreinte SHA-256
        run: |
          F=$(keytool -list -v -keystore signing.keystore -alias oda -storepass "$PASS" | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')
          echo "$F" > empreinte.txt
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.odashop.app","sha256_cert_fingerprints":["%s"]}}]\n' "$F" > assetlinks.json
          cat assetlinks.json
      - uses: actions/upload-artifact@v4
        with: {name: apk-et-assetlinks, path: "oda-shop.apk\nassetlinks.json"}
      - if: steps.cle.outputs.neuve == '1'
        uses: actions/upload-artifact@v4
        with: {name: CLE-A-GARDER, path: cle/}
